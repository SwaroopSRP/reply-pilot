[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "replypilot"
version = "0.1.0"
description = "ReplyPilot — AI Support Copilot"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
